name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest -v
      - name: Noninterference fuzzer
        run: python tools/fuzz_noninterference.py 1000
      - name: Grammar is LL(1)
        run: python demo.py --formal grammar | tail -n 3
      - name: Package builds
        run: |
          python -m pip install --upgrade pip build
          python -m build
