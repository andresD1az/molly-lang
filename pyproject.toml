[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "molly-lang"
version = "0.8.0"
description = "A small language for AI-agent plans where permissions follow the data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Eyner Andres Diaz" }]
keywords = ["dsl", "language", "ai-agents", "security", "information-flow-control", "prompt-injection", "parser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Interpreters",
]

[project.urls]
Homepage = "https://github.com/andresD1az/molly-lang"
Repository = "https://github.com/andresD1az/molly-lang"
Issues = "https://github.com/andresD1az/molly-lang/issues"
Changelog = "https://github.com/andresD1az/molly-lang/blob/main/CHANGELOG.md"
Author = "https://andresdiazd.com/"

[tool.setuptools]
# Only the engine is installed. demo.py, the examples and molly_lab stay in the repository.
py-modules = ["molly"]
