[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "molly-lang"
version = "0.7.0"
description = "A small language for AI-agent plans where permissions follow the data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Eyner Andres Diaz" }]
keywords = ["dsl", "language", "ai-agents", "security", "information-flow-control", "prompt-injection", "parser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Interpreters",
]

[project.urls]
Homepage = "https://andresdiazd.com/"

[project.scripts]
molly-demo = "demo:main"

[tool.setuptools]
py-modules = ["molly", "demo"]
